[package]
name = "exiled-exchange-2-hyprland"
version = "0.1.0"
edition = "2021"
description = "Hyprland-native platform layer for Exiled Exchange 2"
license = "MIT"
publish = false

[[bin]]
name = "ee2-hyprland"
path = "src/main.rs"

[dependencies]
# async runtime + HTTP/WS host server (mirrors upstream's main/src/server.ts).
# WS `/events` uses axum's built-in WebSocket support (`ws` feature).
# `futures-util` provides the Stream/Sink/Future extension traits used on it
# (`.split()`/`.next()`/`.send()`, `now_or_never()` in game_log.rs) — axum
# depends on it too, but that doesn't make it usable here without a direct
# dependency.
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"

# overlay window: layer-shell surface + WebView, see overlay/
#
# gtk4's `v4_10` feature must be enabled explicitly (Cargo feature
# unification applies it crate-wide): webkit6 0.6.1's generated bindings
# reference `gtk::Accessible`, which gtk4-rs 0.11.5 gates behind that
# feature, but webkit6's own Cargo.toml doesn't request it — enabling it
# here is what makes webkit6 compile at all. System libgtk4 on this
# machine is 4.22, well above the minimum this asks for.
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
webkit6 = "0.6"

# input: evdev reads + EVIOCGRAB capture while the game is focused (hotkeys,
# input/grab.rs) and uinput virtual devices (injection, capture mirror).
# `tokio` feature gives `Device::into_event_stream()` (async reads, so the
# device readers don't block the runtime the axum server also runs on).
evdev = { version = "0.13", features = ["tokio"] }

# clipboard: wlr-data-control-unstable-v1, event-driven (see clipboard.rs).
# wayland-protocols-wlr's `client` feature is what actually generates the
# data-control bindings (and pulls in wayland-client itself) — without it
# the crate compiles but exposes nothing.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# `event`: `poll`+`eventfd`, used by clipboard.rs's writer thread to
# multiplex "new write job" against the wayland connection's own fd without
# a timer. `fs`: inotify for game_log.rs's event-driven Client.txt tail.
# Already a transitive dep of wayland-client/evdev, so this adds no new
# library to the tree.
rustix = { version = "1", features = ["event", "fs"] }

# tray icon (replaces AppTray.ts)
ksni = "0.3"

# renderer/dist embedded into the binary at build time. `mime-guess` gets us
# per-file Content-Type without a separate mime_guess dependency of our own.
rust-embed = { version = "8", features = ["mime-guess"] }

# config parsing (upstream config.json is plain JSON; the few lines needed
# from poe2_production_Config.ini are parsed by hand in config.rs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# outbound HTTPS relay to trade-site APIs (proxy.rs) — rustls instead of the
# default (native-tls/OpenSSL) backend, no system TLS lib dependency. No
# `cookies` feature: proxy.rs keeps its own per-host name=value jar
# (attributes such as Cloudflare's `Partitioned`, which upstream's proxy.ts
# strips explicitly, are dropped by construction).
# gzip/brotli/zstd/deflate: matches upstream's own decompression model —
# Electron's `net.request` decompresses transparently at the network-stack
# level, so `main/src/proxy.ts` never has to think about it. reqwest does
# the same *only* as long as we don't forward the renderer's own
# `Accept-Encoding` (see proxy.rs::request_headers) — setting these
# features alone isn't sufficient without that.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
