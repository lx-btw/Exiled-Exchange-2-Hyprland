[package]
name = "exiled-exchange-2-hyprland"
version = "0.1.0"
edition = "2021"
description = "Hyprland-native platform layer for Exiled Exchange 2"
license = "MIT"
publish = false

[[bin]]
name = "ee2-hyprland"
path = "src/main.rs"

[dependencies]
# async runtime + HTTP/WS host server (mirrors host.mjs's http+ws server)
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-tungstenite = "0.30"

# overlay window: layer-shell surface + WebView, see overlay/
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
webkit6 = "0.6"

# input: evdev read (hotkeys, no EVIOCGRAB) + uinput virtual keyboard (injection)
evdev = "0.13"

# clipboard: wlr-data-control-unstable-v1, event-driven (see clipboard.rs)
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"

# tray icon (replaces AppTray.ts)
ksni = "0.3"

# renderer/dist embedded into the binary at build time
rust-embed = "8"

# config parsing (upstream config.json is plain JSON; poe2_production_Config.ini
# needs an ini-style parser for GameConfig.ts's showModsKey — Stage 5)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# misc
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
